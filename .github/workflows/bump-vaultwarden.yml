name: Bump Vaultwarden

on:
  # Every 6 hours so a pulled release or re-pushed image is caught inside the
  # rollback window, before Supervisor's one-day hold ends. Bumps still wait
  # out the soak.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, to look up earlier pins and the last bump commit.
          fetch-depth: 0

      - name: Check pin and bump
        run: .github/scripts/bump-vaultwarden.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Days both the GitHub release and the image push must be public
          # before we adopt them. Supervisor waits one more day.
          SOAK_DAYS: 2
          # A bump younger than this can't have been installed yet, so it is
          # safe to roll back.
          ROLLBACK_HOURS: 24
